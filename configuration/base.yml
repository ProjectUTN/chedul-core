server:
  port: 8080
  loglevel: INFO
  # Origenes permitidos para el frontend. En produccion se pisa con CORS_ORIGINS.
  cors_origins:
    - http://localhost:5173
  pool:
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: 30m
    conn_max_idletime: 5m

database:
  host: 127.0.0.1
  port: 5432
  user: chedul
  password: chedul
  name: chedul-db
  require_ssl: false
  # Aplica las migraciones pendientes al iniciar el servidor
  auto_migrate: true

uploads:
  dir: uploads
  max_size_mb: 25

tracer_provider:
  service_name: "chedul-core"
  protocol: http/protobuf
  endpoint: "https://api.honeycomb.io"

# Login con Google (Google Cloud > Credenciales > ID de cliente OAuth web).
# Es publico; GOOGLE_CLIENT_ID lo pisa.
google:
  client_id: "753152353813-25vhkbbbr9s8m20e7jaj74fj6n0mfkrs.apps.googleusercontent.com"
