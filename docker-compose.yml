services:
  chedul-core: 
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ALLOW_DB_ALIAS: true
      API_HOST: 0.0.0.0
      DB_HOST: database
    ports:
      - "8080:8080"
    depends_on:
      - database

  database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: chedul
      POSTGRES_NAME: chedul-db
      POSTGRES_PASSWORD: chedul
      POSTGRES_DB: chedul-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

