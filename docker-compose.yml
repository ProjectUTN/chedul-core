# Levanta la API y Postgres para desarrollo local:
#   docker compose up --build
# La API queda en http://localhost:8080 y aplica las migraciones al iniciar.
services:
  chedul-core:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ENV: development
      ALLOW_DB_ALIAS: "true"
      DB_HOST: database
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-desarrollo}
      HONEYCOMB_API_KEY: ${HONEYCOMB_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    depends_on:
      - database

  database:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: chedul
      POSTGRES_PASSWORD: chedul
      POSTGRES_DB: chedul-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads:
