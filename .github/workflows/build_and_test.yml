name: build_and_test

on:
  push:
    branches: 
      - main
    tags:
      - "*"

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: blacksmith-2vcpu-ubuntu-2404    

    name: build_and_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull and cache Docker images for testcontainers
        run: |
          CACHE_IMAGE="ghcr.io/projectutn/chedul-core/postgres-cache:17-alpine"
          ORIGINAL_IMAGE="postgres:17-alpine"
          
          echo "Attempting to pull cached image..."
          if docker pull $CACHE_IMAGE; then
            echo "Found cached image, tagging for testcontainers use"
            docker tag $CACHE_IMAGE $ORIGINAL_IMAGE
          else
            echo "No cached image found, pulling from Docker Hub and caching"
            docker pull $ORIGINAL_IMAGE
            docker tag $ORIGINAL_IMAGE $CACHE_IMAGE
            docker push $CACHE_IMAGE
          fi

      # - name: Install Just
      # - uses: extractions/setup-just@v3
      #   with:
      #     just-version: latest  

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5' 

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Run Tests
        run: CONFIG_DIR=../configuration/ go test -v -cover ./...
