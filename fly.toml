# Configuracion de ejemplo para Fly.io. Antes del primer deploy:
#   fly launch --no-deploy --copy-config
#   fly volumes create chedul_uploads --size 1
#   fly secrets set JWT_SECRET=... DATABASE_URL=... CORS_ORIGINS=https://tu-front.vercel.app
#   fly deploy
app = "chedul-core"
primary_region = "eze"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_ENV = "production"
  UPLOADS_DIR = "/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "chedul_uploads"
  destination = "/uploads"
